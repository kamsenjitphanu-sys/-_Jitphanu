<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>คลังอุปกรณ์สำนักงาน</title>
<style>
body{font-family:Arial,'Noto Sans Thai',sans-serif;margin:0;background:#f5f7fb;color:#222}
header{background:#2563eb;color:white;padding:20px 28px}
nav{display:flex;gap:8px;padding:12px;background:white;border-bottom:1px solid #ddd;flex-wrap:wrap}
button{border:0;border-radius:8px;padding:10px 16px;cursor:pointer;background:#e5e7eb}
button.active,button.primary{background:#2563eb;color:white}
main{padding:28px;max-width:1100px;margin:auto}
.card{background:white;border-radius:14px;padding:20px;margin-bottom:18px;box-shadow:0 2px 10px #0000000d}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.stat{font-size:30px;font-weight:bold;color:#2563eb}
table{width:100%;border-collapse:collapse}
th,td{padding:12px;border-bottom:1px solid #eee;text-align:left}
input,select{padding:10px;border:1px solid #ddd;border-radius:8px;width:100%;box-sizing:border-box}
label{display:block;margin:10px 0 5px;font-weight:bold}
.hidden{display:none}
</style>
</head>
<body>
<header><h1>คลังอุปกรณ์สำนักงาน</h1><div>ระบบจัดการอุปกรณ์และการเบิก-คืน</div></header>
<nav id="nav">
<button class="active" onclick="show('dashboard',this)">Dashboard</button>
<button onclick="show('equipment',this)">อุปกรณ์</button>
<button onclick="show('people',this)">บุคลากร</button>
<button onclick="show('borrow',this)">เบิก-คืน</button>
<button onclick="show('history',this)">ประวัติ</button>
</nav>

<main>
<section id="dashboard">
<div class="grid">
<div class="card"><div>อุปกรณ์ทั้งหมด</div><div class="stat" id="total">0</div></div>
<div class="card"><div>พร้อมใช้งาน</div><div class="stat" id="available">0</div></div>
<div class="card"><div>กำลังถูกยืม</div><div class="stat" id="borrowed">0</div></div>
</div>
<div class="card"><h2>ภาพรวม</h2><p>เลือกเมนูด้านบนเพื่อจัดการข้อมูลคลังอุปกรณ์</p></div>
</section>

<section id="equipment" class="hidden">
<div class="card"><h2>เพิ่มอุปกรณ์</h2>
<label>ชื่ออุปกรณ์</label><input id="eqName" placeholder="เช่น โปรเจกเตอร์">
<label>จำนวน</label><input id="eqQty" type="number" min="1" value="1">
<br><br><button class="primary" onclick="addEquipment()">เพิ่มอุปกรณ์</button>
</div>
<div class="card"><h2>รายการอุปกรณ์</h2><div id="equipmentList"></div></div>
</section>

<section id="people" class="hidden">
<div class="card"><h2>บุคลากร</h2>
<label>ชื่อ</label><input id="personName" placeholder="ชื่อ-นามสกุล">
<br><br><button class="primary" onclick="addPerson()">เพิ่มบุคลากร</button>
</div>
<div class="card"><div id="peopleList"></div></div>
</section>

<section id="borrow" class="hidden">
<div class="card"><h2>เบิกอุปกรณ์</h2>
<label>อุปกรณ์</label><select id="borrowEq"></select>
<label>ผู้เบิก</label><select id="borrowPerson"></select>
<br><br><button class="primary" onclick="borrow()">บันทึกการเบิก</button>
</div>
</section>

<section id="history" class="hidden">
<div class="card"><h2>ประวัติ</h2><div id="historyList"></div></div>
</section>
</main>

<script>
const KEY='office_inventory_v1';
let data=JSON.parse(localStorage.getItem(KEY)||'{"equipment":[],"people":[],"history":[]}');

function save(){localStorage.setItem(KEY,JSON.stringify(data));render();}
function show(id,btn){
 document.querySelectorAll('main>section').forEach(s=>s.classList.add('hidden'));
 document.getElementById(id).classList.remove('hidden');
 document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
 btn.classList.add('active');
 render();
}
function addEquipment(){
 const name=document.getElementById('eqName').value.trim();
 const qty=Math.max(1,Number(document.getElementById('eqQty').value)||1);
 if(!name)return alert('กรุณากรอกชื่ออุปกรณ์');
 data.equipment.push({id:Date.now(),name,qty,available:qty});
 document.getElementById('eqName').value='';
 save();
}
function addPerson(){
 const name=document.getElementById('personName').value.trim();
 if(!name)return alert('กรุณากรอกชื่อ');
 data.people.push({id:Date.now(),name});
 document.getElementById('personName').value='';
 save();
}
function borrow(){
 const e=data.equipment.find(x=>x.id==document.getElementById('borrowEq').value);
 const p=data.people.find(x=>x.id==document.getElementById('borrowPerson').value);
 if(!e||!p)return alert('กรุณาเลือกอุปกรณ์และผู้เบิก');
 if(e.available<1)return alert('อุปกรณ์ไม่พร้อมใช้งาน');
 e.available--;
 data.history.unshift({date:new Date().toLocaleString('th-TH'),equipment:e.name,person:p.name,action:'เบิก'});
 save();
 alert('บันทึกการเบิกแล้ว');
}
function render(){
 const total=data.equipment.reduce((a,x)=>a+x.qty,0);
 const available=data.equipment.reduce((a,x)=>a+x.available,0);
 document.getElementById('total').textContent=total;
 document.getElementById('available').textContent=available;
 document.getElementById('borrowed').textContent=total-available;

 document.getElementById('equipmentList').innerHTML=data.equipment.length?
 '<table><tr><th>อุปกรณ์</th><th>ทั้งหมด</th><th>พร้อมใช้</th></tr>'+
 data.equipment.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.qty}</td><td>${x.available}</td></tr>`).join('')+
 '</table>':'ยังไม่มีอุปกรณ์';

 document.getElementById('peopleList').innerHTML=data.people.length?
 '<table><tr><th>ชื่อ</th></tr>'+data.people.map(x=>`<tr><td>${esc(x.name)}</td></tr>`).join('')+'</table>':'ยังไม่มีบุคลากร';

 document.getElementById('borrowEq').innerHTML=data.equipment.map(x=>`<option value="${x.id}">${esc(x.name)} (${x.available} พร้อมใช้)</option>`).join('');
 document.getElementById('borrowPerson').innerHTML=data.people.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');

 document.getElementById('historyList').innerHTML=data.history.length?
 '<table><tr><th>วันที่</th><th>อุปกรณ์</th><th>ผู้เบิก</th><th>รายการ</th></tr>'+
 data.history.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.equipment)}</td><td>${esc(x.person)}</td><td>${x.action}</td></tr>`).join('')+
 '</table>':'ยังไม่มีประวัติ';
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
render();
</script>
</body>
</html>
